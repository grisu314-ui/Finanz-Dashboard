# Series catalogue: raw series as [series.<id>], derived indicators as [indicator.<id>].
# Raw series since M2 part B; indicators follow in M5 (decision E-13, docs/umsetzungsplan.md).
# Parameters decided on 26.09.2026 (E-23); evidence per series in docs/umsetzungsplan.md, M2.
#
# Fields per raw series (checked by fever/config.py, series_catalog):
#   source          "cboe" or "fred"
#   source_id       identifier at the source; the table key is the same in lower case (E-16)
#   name, unit      display texts
#   frequency       "daily", "weekly" or "monthly"
#   release_time    "HH:MM" in America/New_York from which the value is usually available
#   lag_days        calendar days from observation date to publication (regular maximum, E-23).
#                   First fetch only: estimated publication = observation date + lag_days, moved
#                   from Saturday/Sunday to Monday, at release_time, at most the retrieval time (E-14)
#   tolerance_days  E-10 standard: daily 3, weekly 3, monthly 10; other values need tolerance_reason
#   bounds          [lower, upper], inclusive. Catches unit and format errors only; a value outside
#                   is dropped and reported (E-15), so historical extremes must lie well inside
#   license         optional licence note
#   start           optional: observations before this date are ignored (E-24)
#   lead_days       optional: observations may be dated up to this many days after today (E-25)

# --- Cboe daily index closes (CSV). Licence: personal, non-commercial use (E-26) ---

[series.vix]
source = "cboe"
source_id = "VIX"
name = "Cboe Volatility Index (VIX)"
